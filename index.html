<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14120e">
<title>TRU LOAD</title>
<style>
:root{--bg:#14120e;--ink:#f4efe4;--dim:#c0b29c;--line:#3a3226;--pack:#d7b56a;--card:#221c14;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--pack)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#100e0a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--pack);color:#1a140c;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--pack);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<header><h1>TRU <span>LOAD</span></h1><p class="sub">Heavy high and close. Hip belt. Rain doubles it. No pound table.</p></header>
<div class="warn">A wet pack is a different pack. Waterproof the sleep kit and the food before the sky does. This card does not name a maximum pound.</div>
<div class="bar"><input id="q" placeholder="heavy, belt, rain…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
const C=[
{t:"High and close",d:"Heavy items go high in the pack and close to the back. The same weight low and away from the body costs more to carry. The foot-march note puts the saving as high as a quarter of the work, against a load packed low and out."},
{t:"Even",d:"Mid-weight items go side to side, not all in one pocket. A pack that leans walks you into the ditch. Water sits where you can reach it without dumping the bag."},
{t:"The belt",d:"A frame and a hip belt take pressure off the shoulders. The belt sits on the hip bones, not on the soft waist. Shoulder straps hold the pack in, they do not carry it. If the belt is loose, the shoulders are doing the march."},
{t:"Rain",d:"A drenching rain can more than double the weight of a rucksack. Ounces make pounds before the rain. After it, the pounds were already in the cloth. A dry bag around the sleep kit is the difference between a camp and a wet night."},
{t:"What you do not carry",d:"Two tools that do one job. Food you will not eat on this walk. A spare you cannot name a use for. Cord, blade, fire, and water are already lanes. This lane is where they sit."},
{t:"Gap",d:"No packed pound limit, no boot size, no pace table. The body that carries it is the limit. Nav holds the course. Ford holds the crossing. If the pack will not let you stand in the current, it is too much for that water."}
];
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&","<":"<",">":">"}[c]));}
function card(x){return `<article class="card"><div class="k">LOAD</div><div class="big">${esc(x.t)}</div><div>${esc(x.d)}</div><div class="src">Foot marches: heavy high and close to the body, hip belt, rain can more than double the weight. No pound table.</div></article>`;}
function show(l){document.getElementById("out").innerHTML=l.map(card).join("");}
function search(q){q=(q||"").trim().toLowerCase(); if(!q){show(C);return;} const h=C.filter(x=>(x.t+" "+x.d).toLowerCase().includes(q)); document.getElementById("out").innerHTML=h.length?h.map(card).join(""):`<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No invented pound limit.</div></article>`;}
document.getElementById("send").onclick=()=>search(document.getElementById("q").value);
document.getElementById("q").onkeydown=e=>{if(e.key==="Enter") search(e.target.value);};
show(C);
</script>
</body>
</html>
